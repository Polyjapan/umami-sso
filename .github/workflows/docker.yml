name: Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Guard against regressions; upstream-parity baseline is ~900 MB uncompressed.
  MAX_IMAGE_SIZE_MB: 1000
  TEST_IMAGE: umami-sso:test

jobs:
  docker:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # cache-to type=gha is incompatible with load: true (docker exporter).
      # Export GHA cache first, then load a second build from that cache.
      - name: Build image (export cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Load image for tests
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha

      - name: Show layer sizes
        run: docker history --human --no-trunc "$TEST_IMAGE"

      - name: Check image size
        run: |
          set -euo pipefail
          SIZE_BYTES=$(docker image inspect "$TEST_IMAGE" --format='{{.Size}}')
          SIZE_MB=$(awk "BEGIN {printf \"%.1f\", ${SIZE_BYTES}/1024/1024}")
          MAX_BYTES=$((MAX_IMAGE_SIZE_MB * 1024 * 1024))
          echo "Image size: ${SIZE_MB} MB (${SIZE_BYTES} bytes); limit: ${MAX_IMAGE_SIZE_MB} MB"
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::Image size ${SIZE_MB} MB exceeds limit of ${MAX_IMAGE_SIZE_MB} MB"
            exit 1
          fi

      - name: Start Postgres
        run: |
          set -euo pipefail
          docker run -d --name umami-postgres --network host \
            -e POSTGRES_USER=umami \
            -e POSTGRES_PASSWORD=umami \
            -e POSTGRES_DB=umami \
            postgres:15-alpine
          for i in $(seq 1 30); do
            if docker exec umami-postgres pg_isready -U umami; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres (${i}/30)..."
            sleep 2
          done
          echo "::error::Postgres did not become ready"
          docker logs umami-postgres || true
          exit 1

      - name: Run Umami container
        run: |
          set -euo pipefail
          docker run -d --name umami-sso-test --network host \
            -e DATABASE_URL=postgresql://umami:umami@localhost:5432/umami \
            -e APP_SECRET=ci-test-secret \
            "$TEST_IMAGE"

      - name: Wait for heartbeat
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' umami-sso-test 2>/dev/null || echo false)" != "true" ]; then
              echo "::error::Umami container exited before becoming healthy"
              docker logs umami-sso-test || true
              exit 1
            fi
            if curl -sf http://localhost:3000/api/heartbeat; then
              echo
              echo "Heartbeat OK after ${i} attempt(s)"
              exit 0
            fi
            echo "Waiting for heartbeat (${i}/60)..."
            sleep 2
          done
          echo "::error::Umami never became healthy within 120s"
          docker logs umami-sso-test || true
          exit 1

      - name: Dump container logs
        if: always()
        run: |
          echo "::group::umami-sso-test logs"
          docker logs umami-sso-test || true
          echo "::endgroup::"
          echo "::group::umami-postgres logs"
          docker logs umami-postgres || true
          echo "::endgroup::"

      - name: Stop test containers
        if: always()
        run: |
          docker stop umami-sso-test umami-postgres || true
          docker rm umami-sso-test umami-postgres || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:master-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
