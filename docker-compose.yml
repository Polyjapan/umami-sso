---
services:
  umami:
    image: ghcr.io/polyjapan/umami-sso:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@db:5432/umami
      APP_SECRET: replace-me-with-a-random-string
      # DISABLE_LOGIN: true
      # OIDC_ISSUER: https://zitadel.example.com
      # OIDC_CLIENT_ID: your-client-id
      # OIDC_CLIENT_SECRET: your-client-secret
      # OIDC_REDIRECT_URI: https://umami.example.com/api/auth/oidc/callback  # BASE_PATH omitted when empty
      # OIDC_SCOPE: openid profile email
      # OIDC_ROLES_CLAIM: urn:zitadel:iam:org:project:roles
      # OIDC_WRITE_ROLE: write
      # OIDC_VIEW_ROLE: view-only
      # OIDC_DEFAULT_ROLE: view-only
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  umami-db-data:
